<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>EVS · Dashboard de Jogo</title>
<meta name="theme-color" content="#132B18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EVS Andebol">
<link id="manifestLink" rel="manifest" href="">
<link id="appleIcon" rel="apple-touch-icon" href="">
<link id="favicon" rel="icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#132B18;
    --green-900:#2E7D32;
    --green-700:#3B8F40;
    --green-500:#66BB6A;
    --green-100:#E8F5E9;
    --white:#FFFFFF;
    --amber:#E8A33D;
    --red:#C4453F;
    --ink:#1C2620;
    --line:#D7E7D8;
    --shadow: 0 2px 10px rgba(19,43,24,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; -webkit-font-smoothing:antialiased;}
  html,body{background:var(--green-100); color:var(--ink); font-family:'Inter',sans-serif; overscroll-behavior-y:none;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{-webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);}
  input, textarea{-webkit-user-select:text; user-select:text;}
  button, a, .zone-wedge, .goal-cell, .goal-post, .goal-outside, .zone-marker{touch-action:manipulation;}
  input[type=text], input[type=number]{font-size:16px;} /* evita zoom automático no iOS ao focar */
  .display{font-family:'Oswald',sans-serif;}
  .app{max-width:1180px; margin:0 auto; padding-bottom:60px;}

  /* ===== HERO SCOREBOARD ===== */
  .scoreboard{
    position:relative; overflow:hidden;
    background:var(--dark);
    color:var(--white);
    padding:22px 24px 26px;
    border-radius:0 0 22px 22px;
    margin-bottom:18px;
  }
  .scoreboard::before{
    content:"";
    position:absolute; top:0; right:-10%; width:70%; height:220%;
    background:var(--green-900);
    transform:rotate(-14deg);
    transform-origin:top right;
    opacity:.9;
  }
  .scoreboard::after{
    content:"";
    position:absolute; top:0; right:-22%; width:38%; height:220%;
    background:var(--green-500);
    transform:rotate(-14deg);
    transform-origin:top right;
    opacity:.55;
  }
  .sb-top{position:relative; display:flex; justify-content:space-between; align-items:center; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--green-100); opacity:.85; margin-bottom:14px;}
  .sb-brand{font-weight:600;}
  .sb-clock{display:flex; align-items:center; gap:10px;}
  .sb-clock button{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:var(--white); border-radius:7px; padding:4px 10px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; font-family:'Inter',sans-serif;}
  .sb-clock button:hover{background:rgba(255,255,255,.22);}
  .sb-time{font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:.05em; min-width:52px; text-align:center;}
  .sb-main{position:relative; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px;}
  .sb-team{display:flex; flex-direction:column; gap:6px;}
  .sb-team.away{align-items:flex-end; text-align:right;}
  .sb-team input.teamname{
    background:transparent; border:none; border-bottom:1px solid rgba(255,255,255,.35);
    color:var(--white); font-family:'Oswald',sans-serif; font-size:22px; letter-spacing:.02em;
    padding:2px 0; width:100%; max-width:260px;
  }
  .sb-team.away input.teamname{text-align:right; margin-left:auto;}
  .sb-team input.teamname:focus{outline:none; border-bottom-color:var(--green-500);}
  .sb-period{font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--green-100); opacity:.8;}
  .sb-score{display:flex; align-items:baseline; gap:14px; justify-content:center;}
  .sb-score .num{font-family:'Oswald',sans-serif; font-weight:700; font-size:64px; line-height:1; min-width:70px; text-align:center;}
  .sb-score .sep{font-family:'Oswald',sans-serif; font-size:34px; opacity:.5;}
  .sb-periods{position:relative; display:flex; gap:8px; margin-top:16px; justify-content:center; flex-wrap:wrap;}
  .sb-periods button{
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); color:var(--green-100);
    border-radius:20px; padding:6px 14px; font-size:12px; letter-spacing:.05em; cursor:pointer; font-family:'Inter',sans-serif; font-weight:500;
  }
  .sb-periods button.active{background:var(--green-500); color:var(--dark); border-color:var(--green-500); font-weight:600;}

  @media (max-width:900px){
    .scoreboard{padding:10px 14px 12px; border-radius:0 0 14px 14px; margin-bottom:10px;}
    .sb-top{margin-bottom:6px; font-size:9px;}
    .sb-clock button{padding:2px 7px; font-size:9px;}
    .sb-time{font-size:12px; min-width:40px;}
    .sb-main{gap:8px;}
    .sb-team input.teamname{font-size:14px; max-width:140px;}
    .sb-period{font-size:9px;}
    .sb-score{gap:6px;}
    .sb-score .num{font-size:30px; min-width:34px;}
    .sb-score .sep{font-size:18px;}
    .sb-periods{margin-top:6px; gap:5px;}
    .sb-periods button{padding:3px 9px; font-size:10px;}
  }

  /* ===== TABS ===== */
  .tabs{display:flex; gap:6px; padding:0 20px; margin-bottom:16px;}
  .tabs button{
    flex:1; background:var(--white); border:1px solid var(--line); color:var(--green-900);
    padding:10px 6px; border-radius:10px; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    letter-spacing:.02em; cursor:pointer; transition:all .15s;
  }
  .tabs button.active{background:var(--green-900); color:var(--white); border-color:var(--green-900);}
  .tabs button:not(.active):hover{background:var(--green-100);}

  .view{padding:0 20px; display:none;}
  .view.active{display:block;}

  /* ===== SETUP ===== */
  .setup-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:760px){.setup-grid{grid-template-columns:1fr;}}
  .panel{background:var(--white); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow);}
  .panel h3{margin:0 0 12px; font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; color:var(--green-900); text-transform:uppercase; letter-spacing:.04em;}
  .addplayer{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
  .addplayer input[type=text],.addplayer input[type=number]{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-family:'Inter',sans-serif; font-size:16px;
  }
  .addplayer input[type=number]{width:58px;}
  .addplayer input[type=text]{flex:1;}
  .addplayer label.gr{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink); white-space:nowrap;}
  .addplayer button{
    background:var(--green-900); color:var(--white); border:none; border-radius:8px; padding:0 14px;
    font-weight:600; cursor:pointer; font-size:13px;
  }
  .addplayer button:hover{background:var(--green-700);}
  .roster{display:flex; flex-direction:column; gap:6px; max-height:340px; overflow-y:auto;}
  .roster-row{display:flex; align-items:center; gap:10px; padding:7px 10px; background:var(--green-100); border-radius:8px;}
  .roster-row .num{font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; width:22px; text-align:center; color:var(--green-900);}
  .roster-row .name{flex:1; font-size:13.5px; font-weight:500;}
  .roster-row .tag{font-size:10px; text-transform:uppercase; letter-spacing:.06em; background:var(--amber); color:var(--dark); padding:2px 6px; border-radius:5px; font-weight:600;}
  .roster-row .rm{background:none; border:none; color:var(--red); cursor:pointer; font-size:15px; line-height:1; padding:2px 4px;}

  /* ===== LIVE VIEW ===== */
  .pair-headers-row{display:flex; gap:16px; margin-bottom:10px;}
  .pair-header{flex:1; min-width:0;}
  .pair-list{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .pair-row{display:flex; gap:8px;}
  .pair-cell{flex:1; min-width:0;}
  @media (max-width:420px){
    .pair-row{gap:5px;}
    .pcard{padding:8px 6px;}
    .btn-grid{gap:4px;}
    .btn-grid button{font-size:9px; padding:5px 1px;}
  }
  @media (orientation:portrait) and (max-width:600px){
    .pair-row{flex-direction:column;}
    .pair-headers-row{flex-direction:column; gap:4px;}
  }
  .pair-header h3{font-family:'Oswald',sans-serif; font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--green-900); margin:0 0 6px; display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
  .pair-header h3 .score-mini{font-family:'Oswald',sans-serif; background:var(--green-900); color:var(--white); padding:2px 10px; border-radius:6px; font-size:14px;}
  .pair-header h3 .oncourt-count{font-family:'Inter',sans-serif; font-size:10.5px; text-transform:none; letter-spacing:0; color:#5c6b5e; font-weight:600;}
  .pcard{background:var(--white); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; box-shadow:var(--shadow); transition:opacity .15s;}
  .pcard.bench{opacity:.72;}
  .pcard.collapsed{padding:7px 10px; margin-bottom:6px; cursor:pointer; height:52px; overflow:hidden;}
  .pcard-head{
    display:flex;
    align-items:center; gap:6px; height:32px;
  }
  .pcard:not(.collapsed) .pcard-head{margin-bottom:8px;}
  .jersey-btn{background:none; border:none; padding:0; cursor:pointer; line-height:0; flex:0 0 30px;}
  .jersey-icon{width:30px; height:30px; display:block;}
  .pcard-head .name{font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; min-width:0;}
  .gtag-slot{display:flex; align-items:center; justify-content:center; flex:0 0 26px;}
  .pcard-head .gtag{font-size:9.5px; text-transform:uppercase; background:var(--amber); color:var(--dark); padding:2px 6px; border-radius:5px; font-weight:700; letter-spacing:.05em; white-space:nowrap;}
  .pcard-head .mini-stats{font-size:10.5px; color:#5c6b5e; font-family:'Inter',sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right; flex:0 0 64px;}
  .oncourt-btn{font-size:9px; text-transform:uppercase; letter-spacing:.02em; font-weight:700; padding:3px 4px; border-radius:14px; border:1px solid var(--green-500); background:#fff; color:var(--green-700); cursor:pointer; white-space:nowrap; text-align:center; flex:0 0 58px;}
  .oncourt-btn.on{background:var(--green-500); color:#fff; border-color:var(--green-500);}
  .mins-badge{font-size:11px; color:#5c6b5e; text-align:right; flex:0 0 40px;}
  .btn-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:5px;}
  .btn-grid button{
    background:var(--green-100); border:1px solid var(--line); color:var(--green-900);
    border-radius:7px; padding:4px 2px; font-size:10.5px; font-weight:600; cursor:pointer;
    font-family:'Inter',sans-serif; letter-spacing:.01em; line-height:1.2; transition:transform .08s, background .1s;
    height:40px; display:flex; align-items:center; justify-content:center; text-align:center;
  }
  .btn-grid button:hover{background:var(--green-500); color:var(--white);}
  .btn-grid button:active{transform:scale(.94);}
  .btn-grid button.wide{grid-column: span 2;}
  .btn-grid button.neg:hover{background:var(--red); color:var(--white); border-color:var(--red);}
  .btn-grid button.warn:hover{background:var(--amber); color:var(--dark); border-color:var(--amber);}
  .btn-grid button.cardbtn{font-size:9.5px;}
  .btn-grid button.yellow{background:#FDE68A; border-color:#F2C94C; color:#7A5B00;}
  .btn-grid button.yellow:hover{background:#F2C94C; color:#4a3700;}
  .btn-grid button.red2{background:#F8D2D0; border-color:var(--red); color:#8A2622;}
  .btn-grid button.red2:hover{background:var(--red); color:#fff;}
  .btn-grid button.blue{background:#D6E6FB; border-color:#3B82C4; color:#1D4E7A;}
  .btn-grid button.blue:hover{background:#3B82C4; color:#fff;}

  .gr-select{font-size:11px; margin-bottom:10px; display:flex; align-items:center; gap:6px; color:#5c6b5e;}
  .gr-select select{border:1px solid var(--line); border-radius:6px; padding:3px 6px; font-family:'Inter',sans-serif; font-size:11.5px;}

  .log-panel{background:var(--white); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow);}
  .log-panel h3{font-family:'Oswald',sans-serif; font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--green-900); margin:0 0 10px; display:flex; justify-content:space-between; align-items:center;}
  .log-panel .undo{background:var(--dark); color:var(--white); border:none; border-radius:7px; padding:5px 12px; font-size:11.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;}
  .log-panel .undo:hover{background:var(--red);}
  .log-list{max-height:220px; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:0;}
  .log-item{display:flex; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:12.5px; align-items:center;}
  .log-item .lt{font-family:'Oswald',sans-serif; color:#8a978b; width:42px;}
  .log-item .lteam{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .log-item .ldesc{flex:1;}
  .log-item .lzone{color:#8a978b; font-size:11px;}
  .empty-note{color:#8a978b; font-size:12.5px; text-align:center; padding:20px 0;}

  /* ===== STATS VIEW ===== */
  .compare{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  @media (max-width:760px){.compare{grid-template-columns:1fr;}}
  .compare-panel{background:var(--white); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow);}
  .cbar-row{margin-bottom:12px;}
  .cbar-label{display:flex; justify-content:space-between; font-size:11.5px; font-weight:600; margin-bottom:4px; color:var(--ink);}
  .cbar-track{display:flex; height:9px; border-radius:5px; overflow:hidden; background:var(--green-100);}
  .cbar-a{background:var(--green-900);}
  .cbar-b{background:var(--amber);}

  table.stats{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.stats th{text-align:left; font-family:'Inter',sans-serif; font-weight:600; text-transform:uppercase; font-size:10px; letter-spacing:.05em; color:#5c6b5e; padding:6px 6px; border-bottom:2px solid var(--line);}
  table.stats td{padding:7px 6px; border-bottom:1px solid var(--line);}
  table.stats tr:last-child td{border-bottom:none;}
  table.stats td.num, table.stats th.num{text-align:center; font-family:'Oswald',sans-serif;}
  @media (max-width:480px){
    table.stats.player-table th:nth-child(7), table.stats.player-table td:nth-child(7),
    table.stats.player-table th:nth-child(8), table.stats.player-table td:nth-child(8),
    table.stats.player-table th:nth-child(9), table.stats.player-table td:nth-child(9),
    table.stats.player-table th:nth-child(10), table.stats.player-table td:nth-child(10),
    table.stats.player-table th:nth-child(11), table.stats.player-table td:nth-child(11){
      display:none;
    }
    table.stats.player-table{font-size:11.5px;}
  }
  .team-block{margin-bottom:20px;}
  .team-block h3{font-family:'Oswald',sans-serif; font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--green-900); margin:0 0 10px;}
  .top-note{font-size:12px; color:#5c6b5e; margin-top:6px;}

  .zone-compare{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  @media (max-width:760px){.zone-compare{grid-template-columns:1fr;}}
  .zone-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);}
  .zone-panel h4{font-family:'Oswald',sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--green-900); margin:0 0 10px;}
  .shot-summary-compare{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:12px;}
  @media (max-width:760px){.shot-summary-compare{grid-template-columns:1fr;}}
  .shot-summary-panel{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow);}
  .shot-summary-panel h4{font-family:'Oswald',sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--green-900); margin:0 0 12px;}
  .ss-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .ss-cell{display:flex; flex-direction:column; align-items:center; background:var(--green-100); border-radius:10px; padding:10px 4px;}
  .ss-val{font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; color:var(--green-900);}
  .ss-lbl{font-size:10px; color:#5c6b5e; text-transform:uppercase; letter-spacing:.03em; margin-top:2px; text-align:center;}
  .showmore-bar{text-align:center; margin-bottom:12px;}
  .showmore-btn{background:#fff; border:1px solid var(--green-500); color:var(--green-900); border-radius:20px; padding:8px 18px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;}
  .showmore-btn:hover{background:var(--green-100);}
  .zgroup{margin-bottom:14px;}
  .zgroup-title{font-family:'Inter',sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#5c6b5e; margin-bottom:6px; border-bottom:1px solid var(--line); padding-bottom:4px;}
  .heat-court-label{font-family:'Oswald',sans-serif; font-size:10px; font-weight:700; fill:var(--green-900); text-anchor:middle; pointer-events:none;}
  .heat-goal-label{font-family:'Inter',sans-serif; font-size:9.5px; font-weight:700; fill:var(--dark); text-anchor:middle; pointer-events:none;}
  .zbar-row{display:grid; grid-template-columns:82px 1fr 70px; align-items:center; gap:8px; margin-bottom:6px; font-size:11px;}
  .zbar-track{background:var(--green-100); border-radius:5px; height:8px; overflow:hidden;}
  .zbar-fill{background:var(--green-500); height:100%;}
  .zbar-val{text-align:right; color:#5c6b5e; font-family:'Oswald',sans-serif; font-size:11px;}
  .goal-heat{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; border:3px solid var(--dark); border-radius:8px; padding:10px; background:#fff; width:100%;}
  .goal-heat-extra{display:flex; gap:6px; margin-top:6px;}
  .heat-cell{aspect-ratio:1.5; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:6px; flex:1;}
  .heat-num{font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; color:inherit; line-height:1.15;}
  .heat-pct{font-family:'Inter',sans-serif; font-weight:700; font-size:12px; color:inherit; opacity:.75; margin-top:1px;}
  .heat-lbl{font-size:9px; color:inherit; opacity:.75; text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .reset-bar{text-align:center; margin-top:20px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:0 20px;}
  .reset-bar button{font-family:'Inter',sans-serif;}
  .reset-bar > button:not(.save-btn):not([data-gohome]){background:none; border:1px solid var(--red); color:var(--red); border-radius:8px; padding:7px 16px; font-size:12px; font-weight:600; cursor:pointer;}
  .reset-bar > button:not(.save-btn):not([data-gohome]):hover{background:var(--red); color:var(--white);}
  .reset-bar button[data-gohome]{background:#fff; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:7px 16px; font-size:12px; font-weight:600; cursor:pointer;}
  .reset-bar button.save-btn{background:var(--green-900); border:1px solid var(--green-900); color:#fff; border-radius:8px; padding:7px 16px; font-size:12px; font-weight:600; cursor:pointer;}
  .reset-bar button.save-btn:hover{background:var(--green-700);}

  .home-screen{max-width:640px; margin:0 auto; padding:24px 20px 60px;}
  .home-hero{background:var(--dark); border-radius:18px; padding:32px 20px; text-align:center; margin-bottom:20px; position:relative; overflow:hidden;}
  .home-hero::before{content:""; position:absolute; top:0; right:-10%; width:70%; height:220%; background:var(--green-900); transform:rotate(-14deg); transform-origin:top right; opacity:.9;}
  .home-hero::after{content:""; position:absolute; top:0; right:-22%; width:38%; height:220%; background:var(--green-500); transform:rotate(-14deg); transform-origin:top right; opacity:.55;}
  .home-brand{position:relative; font-family:'Oswald',sans-serif; font-size:28px; font-weight:700; color:#fff; letter-spacing:.03em;}
  .home-slogan{position:relative; font-size:12.5px; color:var(--green-100); margin-top:6px; letter-spacing:.02em;}
  .home-actions{display:flex; flex-direction:column; gap:10px; margin-bottom:22px;}

<div class="app" id="app"></div>
<div class="rotate-overlay">
  <div class="rotate-icon">📱</div>
  <div class="rotate-text">Roda o telemóvel para o modo horizontal</div>
  <div class="rotate-sub">Esta app foi feita para ser usada na horizontal</div>
</div>

<script>
/* ============ PWA: ícone, manifesto e funcionamento offline ============
   Tudo gerado em tempo de execução a partir deste único ficheiro — sem precisar
   de nenhum ficheiro extra nem servidor. Isto permite "Adicionar ao ecrã principal"
   no telemóvel e a app abre em ecrã completo, com ícone próprio, como uma app nativa. */
(function setupPWA(){
  try{
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(()=>{ /* nem todos os browsers/telas permitem — o aviso de rodar cobre esse caso */ });
    }
  } catch(e){}
  try{
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#132B18'; ctx.fillRect(0,0,512,512);
    ctx.fillStyle = '#2E7D32';
    ctx.beginPath(); ctx.moveTo(512,0); ctx.lineTo(512,512); ctx.lineTo(180,512); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#66BB6A';
    ctx.beginPath(); ctx.moveTo(512,0); ctx.lineTo(512,340); ctx.lineTo(370,512); ctx.lineTo(300,512); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '700 150px Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('EVS', 256, 270);
    const iconUrl = canvas.toDataURL('image/png');
    const appleIcon = document.getElementById('appleIcon'); if(appleIcon) appleIcon.href = iconUrl;
    const favicon = document.getElementById('favicon'); if(favicon) favicon.href = iconUrl;

    const manifest = {
      name: 'EVS · Dashboard de Jogo',
      short_name: 'EVS Andebol',
      start_url: location.href,
      display: 'standalone',
      orientation: 'landscape',
      background_color: '#132B18',
      theme_color: '#132B18',
      icons: [
        { src: iconUrl, sizes: '512x512', type: 'image/png' },
        { src: iconUrl, sizes: '192x192', type: 'image/png' }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestLink = document.getElementById('manifestLink');
    if(manifestLink) manifestLink.href = URL.createObjectURL(manifestBlob);

    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline opcional, ignora se falhar (ex: a abrir como ficheiro local) */ });
    }
  } catch(e){ /* ambiente sem canvas/serviceWorker — a app continua a funcionar normalmente */ }
})();

/* ============ CONSTANTES ============ */
const EVENT_TYPES = {
  golo:      { label: 'Golo',              cls: '' },
  falhado:   { label: 'Remate Falhado',    cls: 'neg' },
  defendido: { label: 'Rem. Defendido',    cls: 'neg' },
  bloqueio:  { label: 'Bloco',             cls: 'warn' },
  remate:    { label: 'Remate',            cls: '' },
  assist:    { label: 'Assistência',       cls: '' },
  exclusao:  { label: '2\'',               cls: 'warn' },
  perda:     { label: 'Perda de Bola',     cls: 'neg' },
  p7m_golo:  { label: '7m Marcado',        cls: '' },
  p7m_falha: { label: '7m Falhado',        cls: 'neg' },
  amarelo:   { label: 'Amarelo',           cls: 'yellow' },
  vermelho:  { label: 'Vermelho',          cls: 'red2' },
  azul:      { label: 'Azul',              cls: 'blue' },
  tecnica_mau_passe: { label: 'Falha Técnica: Mau Passe',      cls: 'neg' },
  tecnica_passos:    { label: 'Falha Técnica: Passos',         cls: 'neg' },
  tecnica_dribles:   { label: 'Falha Técnica: Dribles',        cls: 'neg' },
  tecnica_roubo:     { label: 'Falha Técnica: Roubo de Bola',  cls: 'neg' },
  '7m_cometido':     { label: '7m Cometido',  cls: 'warn' },
  '7m_sofrido':      { label: '7m Sofrido',   cls: '' },
  ressalto:  { label: 'Ressalto',          cls: '' },
  bloco_feito: { label: 'Bloco',           cls: '' }
};
const SIMPLE_TYPES = ['assist','exclusao','perda','amarelo','vermelho','azul','tecnica_mau_passe','tecnica_passos','tecnica_dribles','tecnica_roubo','7m_cometido','7m_sofrido','ressalto','bloco_feito'];
const TECHNICAL_TYPES = ['tecnica_mau_passe','tecnica_passos','tecnica_dribles','tecnica_roubo'];
const SHOT_TYPES = ['golo','falhado','defendido','bloqueio','p7m_golo','p7m_falha'];
const COURT_ZONES = ['Ponta Esq.','Lateral Esq.','Lateral Esq. Longe','Central','Central Longe','Lateral Dir.','Lateral Dir. Longe','Ponta Dir.','7 Metros'];
const GOAL_ZONES = ['Sup. Esq.','Sup. Centro','Sup. Dir.','Meio Esq.','Meio Centro','Meio Dir.','Inf. Esq.','Inf. Centro','Inf. Dir.'];
const OUTSIDE_ZONES = ['Poste', 'Fora'];

/* ============ ESTADO ============ */
const state = {
  teamA: { name: 'EVS', players: [] },
  teamB: { name: 'Adversário', players: [] },
  score: { A: 0, B: 0 },
  period: '1ª Parte',
  clock: { seconds: 0, running: false, interval: null },
  events: [],
  tab: 'home',
  nextId: 1,
  pendingShot: null,
  pendingTechnical: null,
  pendingPlayerDetail: null,
  showMoreStats: false,
  newGame: null,
  managingTeamId: null,
  pendingDialog: null,
  pendingHistoryPlayer: null,
  homeShowHeatmaps: false,
  expandedPlayers: {}
};

/* ============ DIÁLOGO PRÓPRIO (substitui confirm()/alert() nativos, que podem
   não funcionar dentro de um WebView / APK) ============ */
function showDialog(message, onConfirm, type){
  state.pendingDialog = { message, onConfirm: onConfirm || (()=>{}), type: type || 'confirm' };
  render();
}
function closeDialog(){ state.pendingDialog = null; render(); }
function openHistoryPlayer(name, gr){ state.pendingHistoryPlayer = { name, gr }; render(); }
function closeHistoryPlayer(){ state.pendingHistoryPlayer = null; render(); }
function confirmDialog(){
  const d = state.pendingDialog;
  state.pendingDialog = null;
  if(d && d.onConfirm) d.onConfirm();
  else render();
}
function renderDialogModal(){
  const d = state.pendingDialog;
  return `
  <div class="modal-backdrop" data-dialog-cancel="1">
    <div class="modal-box small" onclick="event.stopPropagation()">
      <h3>${d.type==='alert' ? 'Aviso' : 'Confirmar'}</h3>
      <p style="font-size:13.5px; color:var(--ink); line-height:1.5; margin:0 0 18px;">${d.message}</p>
      <div class="modal-actions">
        ${d.type==='confirm' ? `<button class="mbtn cancel" data-dialog-cancel="1">Cancelar</button>` : ''}
        <button class="mbtn primary" data-dialog-confirm="1">${d.type==='alert' ? 'OK' : 'Confirmar'}</button>
      </div>
    </div>
  </div>`;
}

function emptyStats(){
  return {
    golos:0, remates:0, assist:0, exclusoes:0, perdas:0, p7mM:0, p7mF:0, defesasGR:0, golosSofridosGR:0, bloqueios:0,
    amarelos:0, vermelhos:0, azuis:0,
    tecMauPasse:0, tecPassos:0, tecDribles:0, tecRoubo:0,
    setemCometido:0, setemSofrido:0, ressaltos:0, blocosFeitos:0
  };
}

/* ============ HELPERS ============ */
function fmtClock(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return m+':'+sec;
}
function otherTeam(k){ return k==='A' ? 'B' : 'A'; }
function findPlayer(teamKey, pid){
  return state[teamKey==='A'?'teamA':'teamB'].players.find(p=>p.id===pid);
}
function getOnCourtGR(teamKey){
  const teamObj = state[teamKey==='A'?'teamA':'teamB'];
  return teamObj.players.find(p=>p.gr && p.isOnCourt) || null;
}

/* ============ AÇÕES DE JOGO ============ */
function addPlayer(teamKey, num, name, isGR){
  if(!name.trim()) return;
  const teamObj = state[teamKey==='A'?'teamA':'teamB'];
  const player = { id: state.nextId++, num: num || '-', name: name.trim(), gr: !!isGR, isOnCourt:false, secondsOnCourt:0, stats: emptyStats() };
  teamObj.players.push(player);
  if(isGR && !getOnCourtGR(teamKey)) player.isOnCourt = true;
  render();
}
function removePlayer(teamKey, pid){
  const teamObj = state[teamKey==='A'?'teamA':'teamB'];
  teamObj.players = teamObj.players.filter(p=>p.id!==pid);
  render();
}
function toggleOnCourt(teamKey, pid){
  const p = findPlayer(teamKey, pid);
  if(!p) return;
  const turningOn = !p.isOnCourt;
  if(turningOn && p.gr){
    // só pode haver 1 GR em campo de cada vez
    const teamObj = state[teamKey==='A'?'teamA':'teamB'];
    teamObj.players.forEach(other=>{ if(other.gr && other.id!==p.id) other.isOnCourt = false; });
  }
  p.isOnCourt = turningOn;
  render();
}


function registerEvent(teamKey, pid, type, zoneShot, zoneGoal){
  const player = findPlayer(teamKey, pid);
  if(!player) return;
  const s = player.stats;
  const oppKey = otherTeam(teamKey);
  const oppGR = getOnCourtGR(oppKey);

  switch(type){
    case 'golo':
      s.golos++; s.remates++; state.score[teamKey]++;
      if(oppGR) oppGR.stats.golosSofridosGR++;
      break;
    case 'falhado':
      s.remates++;
      break;
    case 'defendido':
      s.remates++;
      if(oppGR) oppGR.stats.defesasGR++;
      break;
    case 'bloqueio':
      s.remates++; s.bloqueios++;
      break;
    case 'assist':
      s.assist++;
      break;
    case 'exclusao':
      s.exclusoes++;
      break;
    case 'perda':
      s.perdas++;
      break;
    case 'p7m_golo':
      s.p7mM++; s.golos++; state.score[teamKey]++;
      if(oppGR) oppGR.stats.golosSofridosGR++;
      break;
    case 'p7m_falha':
      s.p7mF++;
      if(oppGR) oppGR.stats.defesasGR++;
      break;
    case 'amarelo': s.amarelos++; break;
    case 'vermelho': s.vermelhos++; break;
    case 'azul': s.azuis++; break;
    case 'tecnica_mau_passe': s.tecMauPasse++; break;
    case 'tecnica_passos': s.tecPassos++; break;
    case 'tecnica_dribles': s.tecDribles++; break;
    case 'tecnica_roubo': s.tecRoubo++; break;
    case '7m_cometido': s.setemCometido++; break;
    case '7m_sofrido': s.setemSofrido++; break;
    case 'ressalto': s.ressaltos++; break;
    case 'bloco_feito': s.blocosFeitos++; break;
  }

  state.events.push({
    id: Date.now()+Math.random(),
    time: fmtClock(state.clock.seconds),
    period: state.period,
    teamKey, pid,
    playerLabel: (player.num!=='-' ? '#'+player.num+' ' : '') + player.name,
    type,
    zoneShot: zoneShot || null,
    zoneGoal: zoneGoal || null,
    oppGRid: oppGR ? oppGR.id : null
  });
  render();
}

function undoLast(){
  const last = state.events.pop();
  if(!last) return;
  const player = findPlayer(last.teamKey, last.pid);
  if(player){
    const s = player.stats;
    const oppGR = last.oppGRid ? findPlayer(otherTeam(last.teamKey), last.oppGRid) : null;
    switch(last.type){
      case 'golo': s.golos--; s.remates--; state.score[last.teamKey]--; if(oppGR) oppGR.stats.golosSofridosGR--; break;
      case 'falhado': s.remates--; break;
      case 'defendido': s.remates--; if(oppGR) oppGR.stats.defesasGR--; break;
      case 'bloqueio': s.remates--; s.bloqueios--; break;
      case 'assist': s.assist--; break;
      case 'exclusao': s.exclusoes--; break;
      case 'perda': s.perdas--; break;
      case 'p7m_golo': s.p7mM--; s.golos--; state.score[last.teamKey]--; if(oppGR) oppGR.stats.golosSofridosGR--; break;
      case 'p7m_falha': s.p7mF--; if(oppGR) oppGR.stats.defesasGR--; break;
      case 'amarelo': s.amarelos--; break;
      case 'vermelho': s.vermelhos--; break;
      case 'azul': s.azuis--; break;
      case 'tecnica_mau_passe': s.tecMauPasse--; break;
      case 'tecnica_passos': s.tecPassos--; break;
      case 'tecnica_dribles': s.tecDribles--; break;
      case 'tecnica_roubo': s.tecRoubo--; break;
      case '7m_cometido': s.setemCometido--; break;
      case '7m_sofrido': s.setemSofrido--; break;
      case 'ressalto': s.ressaltos--; break;
      case 'bloco_feito': s.blocosFeitos--; break;
    }
  }
  render();
}

function startNewGame(){
  const teamsDB = loadTeamsDB();
  if(teamsDB.length===0){
    showDialog('Ainda não tens nenhuma equipa criada. Cria uma equipa e adiciona jogadores primeiro, em "Equipas e Jogadores".', null, 'alert');
    return;
  }

    showDialog('O jogo atual ainda não foi guardado. Isto vai substituí-lo. Continuar?', proceed);

function computeHistoryStats(history){
  const s = { jogos:history.length, vitorias:0, empates:0, derrotas:0, golosMarcados:0, golosSofridos:0 };
  const scorers = {};
  history.forEach(g=>{
    s.golosMarcados += g.scoreA; s.golosSofridos += g.scoreB;
    if(g.scoreA>g.scoreB) s.vitorias++; else if(g.scoreA===g.scoreB) s.empates++; else s.derrotas++;
    (g.teamAPlayers||[]).forEach(p=>{
      if(!p.stats || !p.stats.golos) return;
      scorers[p.name] = (scorers[p.name]||0) + p.stats.golos;
    });
  });
  let topScorer = null;
  Object.entries(scorers).forEach(([name,golos])=>{
    if(!topScorer || golos>topScorer.golos) topScorer = {name, golos};
  });
  s.topScorer = topScorer;
  return s;
}

function getAllGameRecords(){
  const records = loadHistory().slice();
  const hasCurrent = state.teamA.players.length>0 || state.teamB.players.length>0 || state.events.length>0;
  if(hasCurrent){
    records.push({
      teamAPlayers: state.teamA.players.map(p=>({id:p.id, num:p.num, name:p.name, gr:p.gr, stats:p.stats})),
      teamBPlayers: state.teamB.players.map(p=>({id:p.id, num:p.num, name:p.name, gr:p.gr, stats:p.stats})),
      events: state.events
    });
  }
  return records;
}
function computeCombinedOffenseEvents(records){
  const all = [];
  records.forEach(rec=> (rec.events||[]).forEach(e=>{ if(e.teamKey==='A') all.push(e); }));
  return all;
}
function computeCombinedDefenseEventsForPlayer(records, playerName){
  const all = [];
  records.forEach(rec=>{
    const ourGR = (rec.teamAPlayers||[]).find(p=>p.gr && p.name===playerName);
    if(!ourGR) return;
    (rec.events||[]).forEach(e=>{ if(e.teamKey==='B' && e.oppGRid===ourGR.id) all.push(e); });
  });
  return all;
}
function computeCombinedOffenseEventsForPlayer(records, playerName){
  const all = [];
  records.forEach(rec=>{
    const ourPlayer = (rec.teamAPlayers||[]).find(p=>p.name===playerName);
    if(!ourPlayer) return;
    (rec.events||[]).forEach(e=>{ if(e.teamKey==='A' && e.pid===ourPlayer.id) all.push(e); });
  });
  return all;
}
function computeTopPlayers(records, limit){
  const agg = {};
  records.forEach(rec=>{
    (rec.teamAPlayers||[]).forEach(p=>{
      if(!p.stats) return;
      if(!agg[p.name]) agg[p.name] = { name:p.name, gr:p.gr, golos:0, remates:0, defesasGR:0, golosSofridosGR:0 };
      agg[p.name].golos += p.stats.golos||0;
      agg[p.name].remates += p.stats.remates||0;
      agg[p.name].defesasGR += p.stats.defesasGR||0;
      agg[p.name].golosSofridosGR += p.stats.golosSofridosGR||0;
      if(p.gr) agg[p.name].gr = true;
    });
  });
  return Object.values(agg)
    .sort((a,b)=> (b.gr? b.defesasGR : b.golos) - (a.gr? a.defesasGR : a.golos))
    .slice(0, limit||8);
}

  const p = state.pendingShot;
  if(!p) return;
  if(!p.zoneShot){
    showDialog('Seleciona a zona de remate para confirmar.', null, 'alert');
    return;
  }
  let finalType = p.type;
  if(p.type==='remate'){
    if(p.outcome==='bloqueio'){
      finalType = 'bloqueio';
    } else if(!p.zoneGoal){
      showDialog('Seleciona a zona da baliza para confirmar.', null, 'alert');
      return;
    } else if(OUTSIDE_ZONES.includes(p.zoneGoal)){
      finalType = 'falhado';
    } else {
      if(!p.outcome){
        showDialog('Escolhe se foi Golo ou Defendido.', null, 'alert');
        return;
      }
      finalType = p.outcome;
    }
  } else if(p.type==='p7m_golo'){
    if(!p.zoneGoal){
      showDialog('Seleciona a zona da baliza para confirmar.', null, 'alert');
      return;
    }
  }
  state.pendingShot = null;
  registerEvent(p.teamKey, p.pid, finalType, p.zoneShot, p.zoneGoal);
}

/* ============ ZONAS: AGREGAÇÃO ============ */
const ZONE_GROUP_6M = ['Ponta Esq.','Lateral Esq.','Central','Lateral Dir.','Ponta Dir.'];
const ZONE_GROUP_9M = ['Lateral Esq. Longe','Central Longe','Lateral Dir. Longe'];
const ZONE_GROUP_7M = ['7 Metros'];
function computeShotSummaryFromEvents(events){
  const s = { remates:0, golos:0, defesas:0, poste:0, fora:0, blocos:0, exclusoes:0, tecnicas:0 };
  events.forEach(e=>{
    if(e.type==='exclusao') s.exclusoes++;
    if(TECHNICAL_TYPES.includes(e.type)) s.tecnicas++;
    if(!SHOT_TYPES.includes(e.type)) return;
    s.remates++;
    if(e.type==='golo' || e.type==='p7m_golo') s.golos++;
    else if(e.type==='defendido') s.defesas++;
    else if(e.type==='bloqueio') s.blocos++;
    else if(e.type==='falhado'){
      if(e.zoneGoal==='Poste') s.poste++;
      else if(e.zoneGoal==='Fora') s.fora++;
    }
  });
  return s;
}
function computeShotSummary(teamKey){
  return computeShotSummaryFromEvents(state.events.filter(e=> e.teamKey===teamKey));
}
function computeGroupEff(courtMap, zones){
  let remates=0, golos=0;
  zones.forEach(z=>{
    const d = courtMap[z];
    if(d){ remates += d.remates; golos += d.golos; }
  });
  return remates>0 ? Math.round((golos/remates)*100) : 0;
}
function computeZoneStatsFromEvents(events){
  const courtMap = {}, goalMap = {};
  events.forEach(e=>{
    const isGoal = (e.type==='golo' || e.type==='p7m_golo');
    const isSave = (e.type==='defendido');
    if(e.zoneShot){
      courtMap[e.zoneShot] = courtMap[e.zoneShot] || {remates:0, golos:0, defesas:0};
      courtMap[e.zoneShot].remates++;
      if(isGoal) courtMap[e.zoneShot].golos++;
      if(isSave) courtMap[e.zoneShot].defesas++;
    }
    if(e.zoneGoal){
      goalMap[e.zoneGoal] = goalMap[e.zoneGoal] || {remates:0, golos:0, defesas:0};
      goalMap[e.zoneGoal].remates++;
      if(isGoal) goalMap[e.zoneGoal].golos++;
      if(isSave) goalMap[e.zoneGoal].defesas++;
    }
  });
  return { courtMap, goalMap };
}
function computeZoneStats(teamKey){
  return computeZoneStatsFromEvents(state.events.filter(e=> e.teamKey===teamKey && SHOT_TYPES.includes(e.type)));
}
function computePlayerZoneStats(teamKey, pid, isGR){
  const evts = state.events.filter(e=>{
    if(!SHOT_TYPES.includes(e.type)) return false;
    return isGR ? (e.teamKey!==teamKey && e.oppGRid===pid) : (e.teamKey===teamKey && e.pid===pid);
  });
  return computeZoneStatsFromEvents(evts);
}

/* Geometria do campo (esquema): baliza no topo, linha de 6m (arco sólido) e linha de 9m (arco tracejado).
   1 metro = 16px · a linha de área NÃO é um semicírculo: são dois quartos de círculo
   centrados nos postes + um segmento reto de 3m entre eles (regra oficial de andebol). */
const POST_HALF_W = 24; // 1.5m
const POST_L = { x: 200-POST_HALF_W, y: 30 };
const POST_R = { x: 200+POST_HALF_W, y: 30 };
const ARC_T = 0.43, STRAIGHT_T = 0.57; // proporção real: arco~43%, reta~14%, arco~43%
const SIDELINE_L = 50, SIDELINE_R = 350; // linhas laterais do campo, um pouco mais fechadas

function boundaryPoint(r, t){
  if(t <= ARC_T){
    const angle = 180 - (t/ARC_T)*90;
    const rad = angle*Math.PI/180;
    return { x: POST_L.x + r*Math.cos(rad), y: POST_L.y + r*Math.sin(rad) };
  } else if(t <= STRAIGHT_T){
    const frac = (t-ARC_T)/(STRAIGHT_T-ARC_T);
    return { x: POST_L.x + frac*(POST_R.x-POST_L.x), y: 30+r };
  } else {
    const angle = 90 - ((t-STRAIGHT_T)/(1-STRAIGHT_T))*90;
    const rad = angle*Math.PI/180;
    return { x: POST_R.x + r*Math.cos(rad), y: POST_R.y + r*Math.sin(rad) };
  }
}
// Ponto (t, 0<t<ARC_T) onde o arco de raio r cruza a linha lateral esquerda (a linha deixa de ser
// curva e passa a ser a linha lateral do campo, tal como num campo de andebol real).
function tAtSideline(r){
  const minX = POST_L.x - r;
  if(minX >= SIDELINE_L) return 0; // o arco nunca chega à lateral, não é preciso cortar
  const cosAngle = Math.max(-1, Math.min(1, (SIDELINE_L-POST_L.x)/r));
  const angle = Math.acos(cosAngle) * 180/Math.PI;
  return (180-angle)/90*ARC_T;
}
function boundarySegment(r, t1, t2, sweep){
  const breakpoints = [ARC_T, STRAIGHT_T].filter(bp => bp>t1 && bp<t2);
  const ts = [t1, ...breakpoints, t2];
  let d = '';
  for(let i=0;i<ts.length-1;i++){
    const a=ts[i], b=ts[i+1];
    const mid=(a+b)/2;
    const pb = boundaryPoint(r,b);
    if(mid <= ARC_T || mid > STRAIGHT_T){
      d += ` A${r},${r} 0 0 ${sweep} ${pb.x.toFixed(1)},${pb.y.toFixed(1)}`;
    } else {
      d += ` L${pb.x.toFixed(1)},${pb.y.toFixed(1)}`;
    }
  }
  return d;
}
function boundarySegmentBackward(r, t1, t2){
  const breakpoints = [ARC_T, STRAIGHT_T].filter(bp => bp>t1 && bp<t2);
  const ts = [t1, ...breakpoints, t2].reverse();
  let d = '';
  for(let i=0;i<ts.length-1;i++){
    const a=ts[i], b=ts[i+1];
    const mid=(a+b)/2;
    const pb = boundaryPoint(r,b);
    if(mid <= ARC_T || mid > STRAIGHT_T){
      d += ` A${r},${r} 0 0 1 ${pb.x.toFixed(1)},${pb.y.toFixed(1)}`;
    } else {
      d += ` L${pb.x.toFixed(1)},${pb.y.toFixed(1)}`;
    }
  }
  return d;
}
function wedgePath(t1, t2, rInner, rOuter){
  const innerStart = boundaryPoint(rInner, t1);
  const outerEnd = boundaryPoint(rOuter, t2);
  return `M${innerStart.x.toFixed(1)},${innerStart.y.toFixed(1)} ${boundarySegment(rInner, t1, t2, 0)} L${outerEnd.x.toFixed(1)},${outerEnd.y.toFixed(1)} ${boundarySegmentBackward(rOuter, t1, t2)} Z`;
}
// Ponta: cantinho junto à lateral + uma fatia do anel 6m-9m (até PONTA_INNER_END), que antes
// pertencia à Lateral — o resto (fora dos 9m) da Lateral mantém-se a começar em T1.
function pontaEsqPath(){
  const innerStart = boundaryPoint(R6,0);
  const inner = boundarySegment(R6,0,PONTA_INNER_END,0);
  const outerEnd = boundaryPoint(R9,PONTA_INNER_END);
  const arcBack = boundarySegmentBackward(R9,T1,PONTA_INNER_END);
  return `M${innerStart.x.toFixed(1)},${innerStart.y.toFixed(1)} ${inner} L${outerEnd.x.toFixed(1)},${outerEnd.y.toFixed(1)} ${arcBack} L${SIDELINE_L.toFixed(1)},30.0 Z`;
}
function pontaDirPath(){
  const innerStart = boundaryPoint(R6,1);
  const inner = boundarySegmentBackward(R6,1-PONTA_INNER_END,1);
  const outerEnd = boundaryPoint(R9,1-PONTA_INNER_END);
  const arcFwd = boundarySegment(R9,1-PONTA_INNER_END,1-T1,0);
  return `M${innerStart.x.toFixed(1)},${innerStart.y.toFixed(1)} ${inner} L${outerEnd.x.toFixed(1)},${outerEnd.y.toFixed(1)} ${arcFwd} L${SIDELINE_R.toFixed(1)},30.0 Z`;
}
// Lateral Longe: começa logo a seguir à Ponta (em T1); o raio RFAR só é válido a partir de TFAR,
// por isso o contorno segue a lateral nesse troço inicial.
function lateralEsqLongePath(t2){
  const innerStart = boundaryPoint(R9,T1);
  const inner = boundarySegment(R9,T1,t2,0);
  const outerEnd = boundaryPoint(RFAR,t2);
  const arcBack = boundarySegmentBackward(RFAR,TFAR,t2);
  return `M${innerStart.x.toFixed(1)},${innerStart.y.toFixed(1)} ${inner} L${outerEnd.x.toFixed(1)},${outerEnd.y.toFixed(1)} ${arcBack} L${innerStart.x.toFixed(1)},${innerStart.y.toFixed(1)} Z`;
}
function lateralDirLongePath(t1){
  const innerStart = boundaryPoint(R9,1-T1);
  const inner = boundarySegmentBackward(R9,t1,1-T1);
  const outerEnd = boundaryPoint(RFAR,t1);
  const arcFwd = boundarySegment(RFAR,t1,1-TFAR,0);
  return `M${innerStart.x.toFixed(1)},${innerStart.y.toFixed(1)} ${inner} L${outerEnd.x.toFixed(1)},${outerEnd.y.toFixed(1)} ${arcFwd} L${innerStart.x.toFixed(1)},${innerStart.y.toFixed(1)} Z`;
}

const R6 = 96, R9 = 144, RFAR = 190;
const T1 = tAtSideline(R9);      // onde a linha de 9m (referência) cruza a lateral
const TFAR = tAtSideline(RFAR);  // onde o limite "Longe" cruzaria a lateral
const PONTA_INNER_END = T1 + 0.04; // a Lateral come um pouco do espaço que a Ponta tinha ganhado
const MID_SPAN = 1 - 2*PONTA_INNER_END;
const CENTRAL_SPAN = 0.26;       // Central um pouco maior
const LAT_SPAN = (MID_SPAN - CENTRAL_SPAN) / 2;
const LAT_ESQ_1 = PONTA_INNER_END, LAT_ESQ_2 = PONTA_INNER_END+LAT_SPAN;
const CEN_1 = LAT_ESQ_2, CEN_2 = CEN_1+CENTRAL_SPAN;
const LAT_DIR_1 = CEN_2, LAT_DIR_2 = 1-PONTA_INNER_END;
const WEDGE_DEFS = [
  { zone:'Ponta Esq.',        custom:'pontaEsq' },
  { zone:'Lateral Esq.',      t1:LAT_ESQ_1, t2:LAT_ESQ_2, rInner:R6, rOuter:R9 },
  { zone:'Lateral Esq. Longe',custom:'lateralEsqLonge', arg:LAT_ESQ_2 },
  { zone:'Central',           t1:CEN_1, t2:CEN_2, rInner:R6, rOuter:R9 },
  { zone:'Central Longe',     t1:CEN_1, t2:CEN_2, rInner:R9, rOuter:RFAR },
  { zone:'Lateral Dir.',      t1:LAT_DIR_1, t2:LAT_DIR_2, rInner:R6, rOuter:R9 },
  { zone:'Lateral Dir. Longe',custom:'lateralDirLonge', arg:LAT_DIR_1 },
  { zone:'Ponta Dir.',        custom:'pontaDir' }
];
function renderCourtSvg(selectedZone){
  const start6 = boundaryPoint(R6,0), start9 = boundaryPoint(R9,T1);
  const arc6 = `M${start6.x.toFixed(1)},${start6.y.toFixed(1)} ${boundarySegment(R6,0,1,0)}`;
  const arc9 = `M${start9.x.toFixed(1)},${start9.y.toFixed(1)} ${boundarySegment(R9,T1,1-T1,0)}`;
  const p7m = { x:200, y:30+112 };       // marca dos 7 metros

  const CUSTOM_PATHS = {
    pontaEsq: pontaEsqPath,
    pontaDir: pontaDirPath,
    lateralEsqLonge: lateralEsqLongePath,
    lateralDirLonge: lateralDirLongePath
  };
  const wedges = WEDGE_DEFS.map(w=>{
    const sel = selectedZone===w.zone;
    const d = w.custom ? CUSTOM_PATHS[w.custom](w.arg) : wedgePath(w.t1, w.t2, w.rInner, w.rOuter);
    return `<path class="zone-wedge ${sel?'sel':''}" d="${d}" data-zoneshot="${w.zone}"></path>`;
  }).join('');

  return `
  <svg class="court-svg" viewBox="${SIDELINE_L-4} 0 ${SIDELINE_R-SIDELINE_L+8} 240" xmlns="http://www.w3.org/2000/svg">
    <path class="court-border" d="M${SIDELINE_L},30 V236 H${SIDELINE_R} V30"></path>
    ${wedges}
    <circle class="zone-marker ${selectedZone==='7 Metros'?'sel':''}" cx="${p7m.x.toFixed(1)}" cy="${p7m.y.toFixed(1)}" r="13" data-zoneshot="7 Metros"></circle>
    <text class="zone-label ${selectedZone==='7 Metros'?'sel':''}" x="${p7m.x.toFixed(1)}" y="${(p7m.y+3).toFixed(1)}" style="pointer-events:none;">7m</text>
    <path class="court-line dashed" d="${arc9}"></path>
    <path class="court-line" d="${arc6}"></path>
    <line class="court-line" x1="${SIDELINE_L}" y1="30" x2="${SIDELINE_R}" y2="30"></line>
    <rect class="goal-rect" x="${POST_L.x}" y="20" width="${POST_R.x-POST_L.x}" height="10"></rect>
  </svg>`;
}

const GOAL_BOX = { x:70, y:34, w:180, h:110 };
function renderGoalSvg(selectedZone, includeOutside){
  const { x:gx, y:gy, w:gw, h:gh } = GOAL_BOX;
  const cols=3, rows=3, cw=gw/cols, ch=gh/rows, postW=10;
  let cells = '';
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const zone = GOAL_ZONES[r*cols+c];
      const cx = gx+c*cw, cy = gy+r*ch;
      const sel = selectedZone===zone;
      const parts = zone.split(' ');
      const tspans = parts.map((t,i)=>`<tspan x="${(cx+cw/2).toFixed(1)}" dy="${i===0?0:11}">${t}</tspan>`).join('');
      cells += `<rect class="goal-cell ${sel?'sel':''}" x="${cx}" y="${cy}" width="${cw}" height="${ch}" data-zonegoal="${zone}"></rect>
                <text class="goal-cell-label ${sel?'sel':''}" x="${(cx+cw/2).toFixed(1)}" y="${(cy+ch/2-3).toFixed(1)}">${tspans}</text>`;
    }
  }
  const outsideSel = selectedZone==='Fora';
  const posteSel = selectedZone==='Poste';
  const frame = includeOutside ? `
    <rect class="goal-post ${posteSel?'sel':''}" x="${gx-postW}" y="${gy-postW}" width="${postW}" height="${gh+postW*2}" data-zonegoal="Poste"></rect>
    <rect class="goal-post ${posteSel?'sel':''}" x="${gx+gw}" y="${gy-postW}" width="${postW}" height="${gh+postW*2}" data-zonegoal="Poste"></rect>
    <rect class="goal-post ${posteSel?'sel':''}" x="${gx-postW}" y="${gy-postW}" width="${gw+postW*2}" height="${postW}" data-zonegoal="Poste"></rect>
  ` : `
    <rect class="goal-frame-border" x="${gx-postW}" y="${gy-postW}" width="${postW}" height="${gh+postW*2}"></rect>
    <rect class="goal-frame-border" x="${gx+gw}" y="${gy-postW}" width="${postW}" height="${gh+postW*2}"></rect>
    <rect class="goal-frame-border" x="${gx-postW}" y="${gy-postW}" width="${gw+postW*2}" height="${postW}"></rect>
  `;
  const outside = includeOutside ? `
    <path class="goal-outside ${outsideSel?'sel':''}" d="M0,0 H320 V${gy+gh+postW} H${gx+gw+postW} V${gy-postW} H${gx-postW} V${gy+gh+postW} H0 Z" data-zonegoal="Fora"></path>
  ` : '';
  return `<svg class="goal-svg" viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg">
    ${outside}
    ${frame}
    ${cells}
  </svg>`;
}

function teamTotals(teamObj){
  const t = { golos:0, remates:0, exclusoes:0, perdas:0, assist:0 };
  teamObj.players.forEach(p=>{
    t.golos += p.stats.golos; t.remates += p.stats.remates;
    t.exclusoes += p.stats.exclusoes; t.perdas += p.stats.perdas; t.assist += p.stats.assist;
  });
  t.eff = t.remates>0 ? Math.round((t.golos/t.remates)*100) : 0;
  return t;
}

function renderStats(){
  const tA = teamTotals(state.teamA);
  const tB = teamTotals(state.teamB);
  const maxGolos = Math.max(tA.golos, tB.golos, 1);
  const maxExcl = Math.max(tA.exclusoes, tB.exclusoes, 1);
  const sA = computeShotSummary('A'), sB = computeShotSummary('B');
  const maxTec = Math.max(sA.tecnicas, sB.tecnicas, 1);
  const { courtMap: courtMapA } = computeZoneStats('A');
  const { courtMap: courtMapB } = computeZoneStats('B');
  const pct6mA = computeGroupEff(courtMapA, ZONE_GROUP_6M), pct6mB = computeGroupEff(courtMapB, ZONE_GROUP_6M);
  const pct9mA = computeGroupEff(courtMapA, ZONE_GROUP_9M), pct9mB = computeGroupEff(courtMapB, ZONE_GROUP_9M);
  const pct7mA = computeGroupEff(courtMapA, ZONE_GROUP_7M), pct7mB = computeGroupEff(courtMapB, ZONE_GROUP_7M);

  function bar(label, valA, valB, maxV){
    const wA = Math.round((valA/maxV)*100), wB = Math.round((valB/maxV)*100);
    return `
    <div class="cbar-row">

      <div class="cbar-track">

      </div>

  const topScorer = [...state.teamA.players, ...state.teamB.players].sort((a,b)=>b.stats.golos-a.stats.golos)[0];

  return `
  <div class="compare">
    <div class="compare-panel">
      <div class="cbar-row" style="margin-bottom:14px;">
        <div class="cbar-label" style="font-family:'Oswald',sans-serif; font-size:13px; text-transform:uppercase;">
          <span>${state.teamA.name}</span><span>Comparação</span><span>${state.teamB.name}</span>
        </div>
      </div>
      ${bar('Golos', tA.golos, tB.golos, maxGolos)}
      ${bar('Eficácia %', tA.eff, tB.eff, 100)}
      ${topScorer && topScorer.stats.golos>0 ? `<div class="top-note">⭐ Melhor marcador: <strong>#${topScorer.num} ${topScorer.name}</strong> (${topScorer.stats.golos} golos)</div>` : ''}
    </div>
  </div>
  <div class="showmore-bar">
    <button class="showmore-btn" data-showmore="1">${state.showMoreStats ? 'Mostrar Menos ▲' : 'Mostrar Mais Estatísticas ▼'}</button>
  </div>
  ${state.showMoreStats ? `
  <div class="compare">
    <div class="compare-panel">
      ${bar('Exclusões', tA.exclusoes, tB.exclusoes, maxExcl)}
      ${bar('Falhas Técnicas', sA.tecnicas, sB.tecnicas, maxTec)}
      ${bar('% 6m', pct6mA, pct6mB, 100)}
      ${bar('% 9m', pct9mA, pct9mB, 100)}
      ${bar('% 7m', pct7mA, pct7mB, 100)}
    </div>
    <div class="compare-panel">
      <div class="cbar-row" style="margin-bottom:6px;">
        <div class="cbar-label" style="font-family:'Oswald',sans-serif; font-size:13px; text-transform:uppercase;"><span>Resumo do Jogo</span></div>
      </div>
      <table class="stats">
        <tr><td>Total de remates</td><td class="num">${tA.remates + tB.remates}</td></tr>
        <tr><td>Total de eventos registados</td><td class="num">${state.events.length}</td></tr>
      </table>
    </div>
  </div>
  <div class="shot-summary-compare">
    ${renderShotSummary('A', state.teamA)}
    ${renderShotSummary('B', state.teamB)}
  </div>
  <div class="zone-compare">
    ${renderZoneBreakdown('A', state.teamA)}
    ${renderZoneBreakdown('B', state.teamB)}
  </div>` : ''}
  ${renderStatsTeamTable('A', state.teamA)}

  `;
}

const ZONE_LABEL_POINTS = {
  'Ponta Esq.':        () => boundaryPoint((R6+R9)/2, PONTA_INNER_END*0.55),
  'Lateral Esq.':      () => boundaryPoint((R6+R9)/2, (LAT_ESQ_1+LAT_ESQ_2)/2),
  'Lateral Esq. Longe':() => boundaryPoint((R9+RFAR)/2, (TFAR+LAT_ESQ_2)/2),
  'Central':           () => boundaryPoint(R9-12, (CEN_1+CEN_2)/2),
  'Central Longe':     () => boundaryPoint((R9+RFAR)/2, (CEN_1+CEN_2)/2),
  'Lateral Dir.':      () => boundaryPoint((R6+R9)/2, (LAT_DIR_1+LAT_DIR_2)/2),
  'Lateral Dir. Longe':() => boundaryPoint((R9+RFAR)/2, (LAT_DIR_1+(1-TFAR))/2),
  'Ponta Dir.':        () => boundaryPoint((R6+R9)/2, 1-PONTA_INNER_END*0.55),
  '7 Metros':          () => ({ x:200, y:30+112 })
};
function heatGoodBadColor(ratio, volumeFactor){
  // ratio: 0 (mau/vermelho) .. 1 (bom/verde). volumeFactor: 0..1, controla a intensidade da cor.
  const r = Math.round(196 + (46-196)*ratio);
  const g = Math.round(69 + (125-69)*ratio);
  const b = Math.round(63 + (50-63)*ratio);
  const alpha = 0.18 + volumeFactor*0.5;
  return { fill:`rgba(${r},${g},${b},${alpha.toFixed(2)})`, white: alpha>0.5 };
}
function renderCourtHeatSvgFromMap(courtMap, mode){
  mode = mode || 'attack'; // 'attack' = eficácia (golos/remates); 'defense' = defesas/remates (GR)
  const maxRemates = Math.max(1, ...COURT_ZONES.map(z => (courtMap[z]?courtMap[z].remates:0)));
  const start6 = boundaryPoint(R6,0), start9 = boundaryPoint(R9,T1);
  const arc6 = `M${start6.x.toFixed(1)},${start6.y.toFixed(1)} ${boundarySegment(R6,0,1,0)}`;
  const arc9 = `M${start9.x.toFixed(1)},${start9.y.toFixed(1)} ${boundarySegment(R9,T1,1-T1,0)}`;
  const CUSTOM_PATHS = { pontaEsq:pontaEsqPath, pontaDir:pontaDirPath, lateralEsqLonge:lateralEsqLongePath, lateralDirLonge:lateralDirLongePath };
  const wedges = WEDGE_DEFS.map(w=>{
    const d = w.custom ? CUSTOM_PATHS[w.custom](w.arg) : wedgePath(w.t1, w.t2, w.rInner, w.rOuter);
    const stat = courtMap[w.zone] || {remates:0, golos:0, defesas:0};
    const volumeFactor = stat.remates/maxRemates;
    const numer = mode==='defense' ? stat.defesas : stat.golos;
    const pct = stat.remates>0 ? Math.round((numer/stat.remates)*100) : 0;
    const ratio = stat.remates>0 ? numer/stat.remates : 0.5;
    const { fill, white } = stat.remates>0 ? heatGoodBadColor(ratio, volumeFactor) : { fill:'var(--green-100)', white:false };
    const lp = ZONE_LABEL_POINTS[w.zone]();
    const textStyle = white ? ' style="fill:#fff"' : '';
    const label = stat.remates>0 ? `<text class="heat-court-label"${textStyle} x="${lp.x.toFixed(1)}" y="${(lp.y-4).toFixed(1)}"><tspan x="${lp.x.toFixed(1)}" dy="0">${numer}/${stat.remates}</tspan><tspan x="${lp.x.toFixed(1)}" dy="11">${pct}%</tspan></text>` : '';
    return `<path d="${d}" fill="${fill}" stroke="var(--green-500)" stroke-width="1"></path>${label}`;
  }).join('');
  const p7mStat = courtMap['7 Metros'] || {remates:0, golos:0, defesas:0};
  const p7mNumer = mode==='defense' ? p7mStat.defesas : p7mStat.golos;
  const p7mPct = p7mStat.remates>0 ? Math.round((p7mNumer/p7mStat.remates)*100) : 0;
  const p7m = { x:200, y:30+112 };
  return `
  <svg class="court-svg" viewBox="${SIDELINE_L-4} 0 ${SIDELINE_R-SIDELINE_L+8} 240" xmlns="http://www.w3.org/2000/svg">
    <path class="court-border" d="M${SIDELINE_L},30 V236 H${SIDELINE_R} V30"></path>
    ${wedges}
    <circle cx="${p7m.x.toFixed(1)}" cy="${p7m.y.toFixed(1)}" r="16" fill="#fff" stroke="var(--green-700)" stroke-width="1.5"></circle>
    <text class="heat-court-label" x="${p7m.x.toFixed(1)}" y="${(p7m.y-1).toFixed(1)}" style="font-size:8px;"><tspan x="${p7m.x.toFixed(1)}" dy="0">${p7mNumer}/${p7mStat.remates}</tspan><tspan x="${p7m.x.toFixed(1)}" dy="9">${p7mPct}%</tspan></text>
    <path class="court-line dashed" d="${arc9}"></path>
    <path class="court-line" d="${arc6}"></path>
    <line class="court-line" x1="${SIDELINE_L}" y1="30" x2="${SIDELINE_R}" y2="30"></line>
    <rect class="goal-rect" x="${POST_L.x}" y="20" width="${POST_R.x-POST_L.x}" height="10"></rect>
  </svg>`;
}
function renderCourtHeatSvg(teamKey){
  const { courtMap } = computeZoneStats(teamKey);
  return renderCourtHeatSvgFromMap(courtMap);
}
function renderGoalHeatGrid(goalMap, mode){
  mode = mode || 'attack';
  const maxRemates = Math.max(1, ...GOAL_ZONES.map(z=>(goalMap[z]?goalMap[z].remates:0)));
  const cells = GOAL_ZONES.map(z=>{
    const d = goalMap[z] || {remates:0, golos:0, defesas:0};
    const numer = mode==='defense' ? d.defesas : d.golos;
    const pct = d.remates>0 ? Math.round((numer/d.remates)*100) : 0;
    const ratio = d.remates>0 ? numer/d.remates : 0.5;
    const volumeFactor = d.remates/maxRemates;
    const { fill, white } = d.remates>0 ? heatGoodBadColor(ratio, volumeFactor) : { fill:'var(--green-100)', white:false };
    return `<div class="heat-cell" style="background:${fill}; color:${white?'#fff':'var(--dark)'}">
      <span class="heat-num">${numer}/${d.remates}</span>
      <span class="heat-pct">${pct}%</span>
    </div>`;
  }).join('');
  const maxOF = Math.max(1, (goalMap['Poste']?.remates||0), (goalMap['Fora']?.remates||0));
  const extra = ['Poste','Fora'].map(z=>{
    const d = goalMap[z] || {remates:0, golos:0, defesas:0};
    const t = d.remates/maxOF;
    const bg = d.remates>0 ? `rgba(196,69,63,${(0.10+t*0.35).toFixed(2)})` : 'var(--green-100)';
    const textColor = t>0.55 ? '#fff' : 'var(--dark)';
    return `<div class="heat-cell" style="background:${bg}; color:${textColor}">
      <span class="heat-num">${d.remates}</span>
      <span class="heat-lbl">${z==='Poste'?'Ao Poste':'Fora'}</span>
    </div>`;
  }).join('');
  return `<div class="goal-heat">${cells}</div><div class="goal-heat-extra">${extra}</div>`;
}

function renderMissedGoalSvg(posteCount, foraCount){

  const cells = GOAL_ZONES.map(z=>{
    const cw=gw/3, ch=gh/3, idx=GOAL_ZONES.indexOf(z);

  }).join('');
  return `<svg class="goal-svg" viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg">
    <path fill="${foraFill}" stroke="var(--line)" d="M0,0 H320 V${gy+gh+postW} H${gx+gw+postW} V${gy-postW} H${gx-postW} V${gy+gh+postW} H0 Z"></path>
    <text class="heat-goal-label" x="${(gx-postW)/2}" y="80">Fora<tspan x="${(gx-postW)/2}" dy="13">${foraCount}</tspan></text>
    <text class="heat-goal-label" x="${gx+gw+postW+((320-(gx+gw+postW))/2)}" y="80">Fora<tspan x="${gx+gw+postW+((320-(gx+gw+postW))/2)}" dy="13">${foraCount}</tspan></text>
    <rect x="${gx-postW}" y="${gy-postW}" width="${postW}" height="${gh+postW*2}" fill="${posteFill}"></rect>
    <rect x="${gx+gw}" y="${gy-postW}" width="${postW}" height="${gh+postW*2}" fill="${posteFill}"></rect>
    <rect x="${gx-postW}" y="${gy-postW}" width="${gw+postW*2}" height="${postW}" fill="${posteFill}"></rect>
    <text class="heat-goal-label" x="${gx+gw/2}" y="14">Postes: ${posteCount}</text>
    ${cells}
  </svg>`;
}

function renderStatsTeamTable(teamKey, teamObj){
  return `
  <div class="team-block">
    <h3>${teamObj.name}</h3>
    ${teamObj.players.length===0 ? '<div class="empty-note">Sem jogadores.</div>' : `
    <table class="stats player-table">
      <thead><tr>
        <th class="num">Nº</th><th>Jogador</th><th class="num">Golos</th><th class="num">Remates</th>
        <th class="num">Efic.%</th><th class="num">7m</th><th class="num">Assist.</th><th class="num">Exclus.</th>
        <th class="num">Perdas</th><th class="num">Def./Sofr.</th><th class="num">Tempo</th>
      </tr></thead>
      <tbody>
        ${teamObj.players.map(p=>{
          const s=p.stats; const eff = s.remates>0? Math.round((s.golos/s.remates)*100):0;
          return `<tr>
            <td class="num">${p.num}</td>
            <td><button class="playername-btn" data-playerdetail="${teamKey}:${p.id}">${p.name}</button>${p.gr?' <span style="color:#8a978b;font-size:10.5px;">(GR)</span>':''}</td>
            <td class="num">${s.golos}</td>
            <td class="num">${s.remates}</td>
            <td class="num">${eff}%</td>
            <td class="num">${s.p7mM}/${s.p7mM+s.p7mF}</td>
            <td class="num">${s.assist}</td>
            <td class="num">${s.exclusoes}</td>
            <td class="num">${s.perdas}</td>
            <td class="num">${p.gr? s.defesasGR+' / '+s.golosSofridosGR : '—'}</td>
            <td class="num">${fmtClock(p.secondsOnCourt)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`}
  </div>`;
}

/* ============ EVENT HANDLERS ============ */
function attachHandlers(){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{ state.tab = el.dataset.tab; render(); };
  });
  document.querySelectorAll('[data-period]').forEach(el=>{
    el.onclick = ()=>{ state.period = el.dataset.period; render(); };
  });
  document.querySelectorAll('[data-addplayer]').forEach(el=>{
    el.onclick = ()=>{
      const tk = el.dataset.addplayer;
      const num = document.getElementById('num_'+tk).value;
      const name = document.getElementById('name_'+tk).value;
      const gr = document.getElementById('gr_'+tk).checked;
      addPlayer(tk, num, name, gr);
    };
  });
  document.querySelectorAll('[data-rmplayer]').forEach(el=>{
    el.onclick = ()=>{
      const [tk,pid] = el.dataset.rmplayer.split(':');
      removePlayer(tk, Number(pid));
    };
  });
  document.querySelectorAll('[data-toggleoncourt]').forEach(el=>{
    el.onclick = ()=>{
      const [tk,pid] = el.dataset.toggleoncourt.split(':');
      toggleOnCourt(tk, Number(pid));
    };
  });
  document.querySelectorAll('[data-togglecard]').forEach(el=>{
    el.onclick = ()=>{
      const pid = Number(el.dataset.togglecard);
      state.expandedPlayers[pid] = !state.expandedPlayers[pid];
      render();
    };
  });
  document.querySelectorAll('[data-ev]').forEach(el=>{
    el.onclick = ()=>{
      const [tk,pid,type] = el.dataset.ev.split(':');
      if(SIMPLE_TYPES.includes(type)) registerEvent(tk, Number(pid), type);
      else openShotModal(tk, Number(pid), type);
    };
  });
  const undoBtn = document.querySelector('[data-undo]');
  if(undoBtn) undoBtn.onclick = undoLast;
  const showMoreBtn = document.querySelector('[data-showmore]');
  if(showMoreBtn) showMoreBtn.onclick = ()=>{ state.showMoreStats = !state.showMoreStats; render(); };

  document.querySelectorAll('[data-zoneshot]').forEach(el=>{
    el.onclick = ()=> setShotZone(el.dataset.zoneshot);
  });
  document.querySelectorAll('[data-zonegoal]').forEach(el=>{
    el.onclick = ()=> setGoalZone(el.dataset.zonegoal);
  });
  document.querySelectorAll('[data-outcome]').forEach(el=>{
    el.onclick = ()=> setOutcome(el.dataset.outcome);
  });
  document.querySelectorAll('[data-technical]').forEach(el=>{
    el.onclick = ()=>{
      const [tk,pid] = el.dataset.technical.split(':');
      openTechnicalModal(tk, Number(pid));
    };
  });
  document.querySelectorAll('[data-techchoice]').forEach(el=>{
    el.onclick = ()=> chooseTechnical(el.dataset.techchoice);
  });
  document.querySelectorAll('[data-tech-cancel]').forEach(el=>{
    el.onclick = ()=> closeTechnicalModal();
  });
  document.querySelectorAll('[data-playerdetail]').forEach(el=>{
    el.onclick = ()=>{
      const [tk,pid] = el.dataset.playerdetail.split(':');
      openPlayerDetail(tk, Number(pid));
    };
  });
  document.querySelectorAll('[data-player-cancel]').forEach(el=>{
    el.onclick = ()=> closePlayerDetail();
  });
  document.querySelectorAll('[data-newgame]').forEach(el=>{ el.onclick = ()=> startNewGame(); });
  document.querySelectorAll('[data-continuegame]').forEach(el=>{ el.onclick = ()=> { state.tab = state.teamA.players.length>0||state.teamB.players.length>0 ? 'live' : 'setup'; render(); }; });
  document.querySelectorAll('[data-gohome]').forEach(el=>{ el.onclick = ()=> goHome(); });
  document.querySelectorAll('[data-finishsave]').forEach(el=>{ el.onclick = ()=> finishAndSaveGame(); });
  document.querySelectorAll('[data-delhistory]').forEach(el=>{
    el.onclick = ()=> deleteHistoryEntry(Number(el.dataset.delhistory));
  });
  document.querySelectorAll('[data-addteam]').forEach(el=>{
    el.onclick = ()=>{
      const input = document.getElementById('newTeamName');
      addTeamToDB(input ? input.value : '');
    };
  });
  document.querySelectorAll('[data-manageteam]').forEach(el=>{
    el.onclick = ()=> toggleManageTeam(Number(el.dataset.manageteam));
  });
  document.querySelectorAll('[data-delteam]').forEach(el=>{
    el.onclick = ()=> deleteTeamFromDB(Number(el.dataset.delteam));
  });
  document.querySelectorAll('[data-adddbplayer]').forEach(el=>{
    el.onclick = ()=>{
      const teamId = Number(el.dataset.adddbplayer);
      const num = document.getElementById('dbnum_'+teamId).value;
      const name = document.getElementById('dbname_'+teamId).value;
      const gr = document.getElementById('dbgr_'+teamId).checked;
      addPlayerToDBTeam(teamId, num, name, gr);
    };
  });
  document.querySelectorAll('[data-rmdbplayer]').forEach(el=>{
    el.onclick = ()=>{
      const [teamId,pid] = el.dataset.rmdbplayer.split(':');
      removePlayerFromDBTeam(Number(teamId), Number(pid));
    };
  });
  document.querySelectorAll('[data-teamsel]').forEach(el=>{
    el.onchange = ()=>{
      const key = el.dataset.teamsel;
      const teamId = Number(el.value);
      state.newGame[key==='A'?'teamAId':'teamBId'] = teamId;
      const team = loadTeamsDB().find(t=>t.id===teamId);
      state.newGame.convocados[key] = defaultConvocados(team);
      render();
    };
  });
  document.querySelectorAll('[data-convocado]').forEach(el=>{
    el.onchange = ()=>{
      const [teamKey,pid] = el.dataset.convocado.split(':');
      state.newGame.convocados[teamKey][pid] = el.checked;
    };
  });
  document.querySelectorAll('[data-startgame]').forEach(el=>{ el.onclick = ()=> confirmStartGame(); });
  document.querySelectorAll('[data-cancelnewgame]').forEach(el=>{ el.onclick = ()=> cancelNewGame(); });
  document.querySelectorAll('[data-showheatmaps]').forEach(el=>{ el.onclick = ()=>{ state.homeShowHeatmaps = !state.homeShowHeatmaps; render(); }; });
  document.querySelectorAll('[data-historyplayer]').forEach(el=>{
    el.onclick = ()=>{
      const [encName, gr] = el.dataset.historyplayer.split(':');
      openHistoryPlayer(decodeURIComponent(encName), gr==='1');
    };
  });
  document.querySelectorAll('[data-history-player-cancel]').forEach(el=>{
    el.onclick = ()=> closeHistoryPlayer();
  });
  document.querySelectorAll('[data-dialog-cancel]').forEach(el=>{ el.onclick = ()=> closeDialog(); });
  document.querySelectorAll('[data-dialog-confirm]').forEach(el=>{ el.onclick = ()=> confirmDialog(); });
  document.querySelectorAll('[data-modal-cancel]').forEach(el=>{
    el.onclick = ()=> closeShotModal();
  });
  document.querySelectorAll('[data-modal-confirm]').forEach(el=>{
    el.onclick = ()=> confirmShot();
  });

  const nameA = document.getElementById('nameA');
  const nameB = document.getElementById('nameB');
  if(nameA) nameA.onblur = ()=>{ state.teamA.name = nameA.value || 'Casa'; render(); };
  if(nameB) nameB.onblur = ()=>{ state.teamB.name = nameB.value || 'Visitante'; render(); };
  if(nameA) nameA.onkeydown = (e)=>{ if(e.key==='Enter') nameA.blur(); };
  if(nameB) nameB.onkeydown = (e)=>{ if(e.key==='Enter') nameB.blur(); };
}

  // --- Equipas e nomes ---
  state.teamA.name = 'EVS';
  state.teamB.name = 'Adversário';

  const rosterA = [
    ['1','Bernardo Silva',true], ['12','Ricardo Costa',true],
    ['4','Tiago Santos',false], ['7','Diogo Ferreira',false], ['10','Miguel Costa',false],
    ['8','André Sousa',false], ['11','Rui Martins',false], ['9','Pedro Alves',false],
    ['6','Bruno Gomes',false], ['14','Nuno Pereira',false]

    ['1','Vasco Lima',true], ['16','Hugo Dias',true],
    ['5','Filipe Rocha',false], ['3','João Neves',false], ['10','Carlos Mendes',false],
    ['7','Luís Barbosa',false], ['11','Simão Cardoso',false], ['9','Marco Teixeira',false],
    ['6','Duarte Pinto',false], ['14','Gonçalo Reis',false]

  rosterB.forEach(([num,name,gr])=> addPlayer('B', num, name, gr));

  const A = state.teamA.players, B = state.teamB.players;
  const byNum = (team,num)=> team.find(p=>p.num===num);

  // --- Sete inicial em campo (o GR já fica em campo automaticamente ao ser criado) ---
